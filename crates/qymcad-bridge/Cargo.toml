[package]
name = "qymcad-bridge"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The channel between the open window and the program a language model starts: one local socket, its owner's alone"

# A CHANNEL AND NOTHING ELSE: no window, no kernel, no document. It carries a call in and an answer out; what the call
# does is the window's business. Without the kernel it builds in seconds anywhere, which is what lets its checks run
# on a system the kernel takes an hour to build on.
[dependencies]
qymcad-paths = { path = "../qymcad-paths" }
serde_json = "1.0.151"
serde = { workspace = true }

# THE NAMED PIPE ON WINDOWS: the calls of the system, through the bindings the window already builds for its own windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# the checks read the pipe's owner and access list back from the system, and make a pipe as another owner would
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints]
workspace = true
