[package]
name = "qymcad-mcp"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The document over the Model Context Protocol: a stdio server a language model drives the way a person drives the window"

[lib]
path = "src/lib.rs"

[[bin]]
name = "qymcad-mcp"
path = "src/main.rs"

[dependencies]
qymcad-core.workspace = true
qymcad-doc.workspace = true
qymcad-io.workspace = true
qymcad-kernel.workspace = true
qymcad-i18n = { path = "../qymcad-i18n" }
# THE PROTOCOL BY HAND, over this one crate: JSON-RPC 2.0 on stdin and stdout, one message per line. A protocol
# SDK would bring an asynchronous runtime for a server that answers one request at a time on one thread - the
# thread the interface language is bound to.
serde_json = "1.0.151"
serde = { workspace = true }

[lints]
workspace = true
