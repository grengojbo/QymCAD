[package]
name = "qymcad-mcp"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "The document over the Model Context Protocol: a stdio server a language model drives the way a person drives the window"

[lib]
path = "src/lib.rs"

[[bin]]
name = "qymcad-mcp"
path = "src/main.rs"

[dependencies]
qymcad-core.workspace = true
qymcad-i18n = { path = "../qymcad-i18n" }
qymcad-tools = { path = "../qymcad-tools" }
# THE PROTOCOL BY HAND, over this one crate: JSON-RPC 2.0 on stdin and stdout, one message per line. A protocol
# SDK would bring an asynchronous runtime for a server that answers one request at a time on one thread - the
# thread the interface language is bound to.
serde_json = "1.0.151"

[dev-dependencies]
# THE WINDOW, FOR THE CHECKS ONLY: a document the server wrote is opened the way a person opens it, and the two
# accounts of it are held together. The program itself stays without a window.
qymcad = { path = "../qymcad" }
qymcad-acceptance = { path = "../qymcad-acceptance" }
# the document, the palette and the picture types the checks measure what the tools did with
qymcad-doc.workspace = true
qymcad-scheme = { path = "../qymcad-scheme" }
egui = "0.35"
# the kept pictures read back as pixels; the version the window already takes
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
