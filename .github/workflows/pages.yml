# THE DOCUMENTATION SITE on GitHub Pages: the guide to modelling with Claude and the help of the program, one mdBook
# a language (site/ and docs/help), built by site/build.sh - the same script a local build runs - and published to
# https://grengojbo.github.io/QymCAD/.
#
# From `main` only, and only when what the site is made of changed - its own pages, the articles of the help, the
# captions of the help's sections in the catalogue, the tool that lays the help in: the guide describes what a release of `main` does, so a page built
# from a branch would describe a program nobody can download yet. The button runs it by hand as well.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/help/**"
      - "i18n/**"
      - "crates/qymcad-help/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time; a newer push makes the older one pointless.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # THE VERSION IS PINNED, as every tool of the release run is: a floating version rebuilds the same sources into a
      # different site the day a new one is published.
      - name: mdBook
        env:
          MDBOOK: "0.5.4"
        run: |
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK}/mdbook-v${MDBOOK}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
          mdbook --version

      # The help is laid into the books by a tool of qymcad-help, built here with the toolchain rust-toolchain.toml
      # names; it needs none of the program's native libraries.
      - name: Build the site
        run: bash site/build.sh

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
