[package]
name = "qymcad"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "QymCAD desktop app (egui + wgpu)"

[lib]
name = "qymcad"
path = "src/lib.rs"

[[bin]]
name = "qymcad"
path = "src/main.rs"

[dependencies]
qymcad-core.workspace = true
qymcad-kernel.workspace = true
qymcad-io.workspace = true
qymcad-doc.workspace = true
# glow stays (the default) as a compiled-in fallback; wgpu is the main path for the GPU viewport, chosen at runtime
eframe = { version = "0.35", features = ["persistence", "wgpu"] }
egui = "0.35"
qymcad-shell = { path = "../qymcad-shell" }
qymcad-i18n = { path = "../qymcad-i18n" }
qymcad-scheme = { path = "../qymcad-scheme" }
qymcad-help = { path = "../qymcad-help" }
qymcad-ui-state = { path = "../qymcad-ui-state" }
qymcad-pick = { path = "../qymcad-pick" }
qymcad-render = { path = "../qymcad-render" }
qymcad-assembly = { path = "../qymcad-assembly" }
qymcad-sketch = { path = "../qymcad-sketch" }
qymcad-part = { path = "../qymcad-part" }
qymcad-meshfit = { path = "../qymcad-meshfit" } # the viewport draws where a body made of a mesh did not close
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.17"
# holding the file chooser's answer on a worker thread - the future is built on the frame thread, and
# waiting for it there is what made the program stop drawing (see gui/file_ask.rs). Already in the tree
# through wgpu and rfd itself, so it costs nothing new.
pollster = "0.4"
egui-phosphor = "0.13"
ron.workspace = true
serde = { workspace = true } # the view settings kept between sessions (ViewPrefs)
serde_json = "1.0.151" # Claude Desktop's settings file, given the server for Claude (Help -> Connect to Claude)
time.workspace = true # the calendar for the document stamp and the autosave clock
qymcad-paths = { path = "../qymcad-paths" }
qymcad-update = { path = "../qymcad-update" } # asking the site whether a newer version exists
directories = "6" # UserDirs: the person's home, for shortening paths in reports
include_dir = "0.7" # the parts library (library/parts) is compiled into the binary
image = { version = "0.25", default-features = false, features = ["png"] } # decoding the logo for the splash screen
fluent-bundle = "0.16.0"
sys-locale = "0.3.2"
unic-langid = "0.9.6"
fluent-syntax = "0.12.0"
ab_glyph = "0.2.32"
# ONLY FOR THE CHECK that the viewport shader parses: a broken shader shows itself when the window opens,
# which is too late and only on a machine with a GPU.
naga = { version = "29", features = ["wgsl-in"] }

# THE MENU BAR OF THE SYSTEM on macOS (see gui/native_menu.rs). Pinned: 0.20 and later ask for rustc 1.90,
# above the workspace's 1.88. Without default features: they are the GTK menus of Linux, not used here.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.19.3", default-features = false }

# The icon is embedded into the .exe only when building FOR Windows (host = windows under CI). On Linux
# and macOS the dependency is not pulled in at all, and build.rs cuts its windows block out through
# cfg(windows).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
